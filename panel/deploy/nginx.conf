# filo-takip-web konteynerinin içindeki nginx yapılandırması.
#
# Depo kökü salt-okunur bağlanır (gerekçe docker-compose.yml içinde) ve kök
# panel/ alt dizinine gösterilir. Hem depoda hem panel klasöründe
# yayınlanmaması gereken dosyalar var; bu yüzden dışarıya yalnızca sayılan
# yollar açılır, geri kalan her şey 404'tür.

server {
    listen 80;
    server_name _;

    root /srv/filo-takip/panel;
    index index.html;

    # Panelin dışarıya açtığı tek şey statik dosyalar; çerçeveye gömülmesine
    # ve tarayıcının içerik tipini tahmin etmesine gerek yok.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    # same-origin DEĞİL: o, çapraz kaynak isteklerden Referer'ı tamamen siler
    # ve OpenStreetMap karo sunucusu siteyi tanıyamayıp "kendini tanıtmayan
    # uygulama" diyerek 403 döndürür. strict-origin-when-cross-origin yalnızca
    # kaynağı (yol olmadan) gönderir; hem karolar çalışır hem yol sızmaz.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;

    # Önbellek denetimi `expires` ile yapılır, `add_header` ile DEĞİL.
    # nginx'te bir location kendi add_header'ını tanımlarsa, sunucu düzeyindeki
    # add_header'ları o location için düşürür; yukarıdaki üç güvenlik başlığı
    # sessizce kaybolurdu. `expires` bu mirası bozmaz.
    #
    # expires -1  ->  Cache-Control: no-cache  (her istekte doğrula)
    # expires 7d  ->  Cache-Control: max-age=604800

    # index.html ve uygulama dosyaları sürümlenmiyor; dosya değişince tarayıcı
    # eskisini göstermesin.
    location = / {
        try_files /index.html =404;
        expires -1;
    }

    location = /index.html { expires -1; }
    location /js/          { expires -1; }
    location /css/         { expires -1; }

    # Leaflet sürümüyle birlikte gelir, elle değişmez.
    location /vendor/ { expires 7d; }

    location = /favicon.ico { access_log off; return 204; }

    # .git ve diğer gizli dosyalar: allowlist zaten kapatıyor, bu ikinci kat.
    location ~ /\. { deny all; }

    # Depo dosyaları ve geri kalan her şey kapalı.
    location / { return 404; }
}
